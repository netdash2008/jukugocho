<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英熟語 記憶カード — 共通テスト対策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Serif+4:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper: #F7F3E9;
    --paper-line: rgba(35,42,59,0.07);
    --card: #FFFDF7;
    --card-border: #E1D8C1;
    --ink: #232A3B;
    --ink-soft: #6B6455;
    --red: #B23B2E;
    --red-soft: #E8C9C2;
    --green: #2F7A4F;
    --green-soft: #CFE3D4;
    --gold: #A9822F;
    --v-verb: #2F5D8A;
    --v-be: #7A4FA0;
    --v-conj: #B23B2E;
    --v-adv: #2F7A4F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* header */
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:18px;
  }
  .masthead h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:.02em;
  }
  .masthead .sub{
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
  }

  /* tabs styled like page bookmark tabs */
  .tabs{display:flex; gap:6px; margin-bottom:18px;}
  .tab{
    flex:1;
    text-align:center;
    padding:10px 8px 9px;
    font-family:'Noto Serif JP', serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--card-border);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .tab.active{
    color:var(--ink);
    background:var(--card);
    border-color:var(--ink);
    font-weight:700;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--ink);
    border-radius:0 8px 8px 8px;
    padding:26px 22px 22px;
    position:relative;
  }
  .levelbar{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:7px;
    margin-bottom:14px;
  }
  .lv-btn{
    padding:7px 4px;
    border-radius:8px;
    border:1px solid var(--card-border);
    background:var(--card);
    font-family:'Noto Serif JP', serif;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    line-height:1.2;
  }
  .lv-btn-top{
    font-size:11.5px;
    font-weight:500;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }
  .lv-btn-bottom{
    font-family:'Source Serif 4', serif;
    font-size:10px;
    color:var(--ink-soft);
  }
  .lv-btn.active .lv-btn-top, .lv-btn.active .lv-btn-bottom{ color:var(--red); }
  .lv-btn.active{
    border-color:var(--red);
    background:var(--red-soft);
  }
  /* ring holes evoking a binder card */
  .panel::before{
    content:"";
    position:absolute;
    left:-9px; top:26px; bottom:26px; width:16px;
    background-image: radial-gradient(circle, var(--paper) 4px, transparent 4.5px);
    background-size: 16px 34px;
    background-repeat: repeat-y;
    border-radius:8px;
    display:none;
  }
  @media(min-width:560px){ .panel::before{display:block;} }

  /* progress footer, page-number style */
  .pagefoot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    font-family:'Noto Serif JP', serif;
    font-size:12px;
    color:var(--ink-soft);
  }
  .pagefoot .count{ letter-spacing:.05em; }

  /* category dot legend */
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin:14px 2px 0; font-size:11px; color:var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* --- FLASHCARD MODE --- */
  .fc-scene{ perspective:1400px; margin:6px 0 20px; }
  .fc-card{
    height:520px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .fc-card.flipped{ transform:rotateY(180deg); }
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border:1px solid var(--card-border);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 24px,
      #FFFDF9;
  }
  .fc-face.back{
    transform:rotateY(180deg);
    justify-content:flex-start;
    padding-top:40px;
    overflow-y:auto;
  }
  .cat-tag{
    position:absolute; top:12px; left:14px;
    font-size:10.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:5px;
    font-family:'Noto Serif JP', serif;
  }
  .fc-en{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:32px;
    color:var(--ink);
    line-height:1.3;
  }
  .fc-ex-front{
    margin-top:14px;
    font-size:20px;
    font-style:italic;
    color:var(--ink-soft);
    font-family:'Source Serif 4', serif;
    line-height:1.5;
    max-width:94%;
  }
  .fc-hint{
    margin-top:14px; font-size:11.5px; color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
  }
  .fc-ja{
    font-family:'Noto Serif JP', serif;
    font-size:24px;
    font-weight:700;
    color:var(--red);
  }
  .fc-ex{
    margin-top:14px;
    font-size:20px;
    font-style:italic;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    line-height:1.5;
    max-width:94%;
  }
  .fc-exja{
    margin-top:6px;
    font-size:17px;
    color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    line-height:1.5;
    max-width:94%;
  }
  .fc-syn-block{
    margin-top:18px;
    padding-top:14px;
    border-top:1px dashed var(--card-border);
    max-width:92%;
  }
  .fc-syn-title{
    font-family:'Noto Serif JP', serif;
    font-size:11px;
    font-weight:700;
    color:var(--v-be);
    border:1px solid var(--v-be);
    border-radius:4px;
    padding:1px 6px;
    margin-right:8px;
  }
  .fc-syn-word{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }
  .fc-syn-note{
    margin-top:5px;
    font-size:12px;
    color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    line-height:1.55;
  }
  .fc-ant-block{
    margin-top:10px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    max-width:92%;
  }
  .fc-ant-title{
    font-family:'Noto Serif JP', serif;
    font-size:11px;
    font-weight:700;
    color:var(--red);
    border:1px solid var(--red);
    border-radius:4px;
    padding:1px 6px;
    margin-right:8px;
  }

  .fc-controls{
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    padding:12px 10px;
    border-radius:7px;
    border:1px solid var(--ink);
    background:var(--card);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.again{ border-color:var(--red); color:var(--red); }
  .btn.again:hover{ background:var(--red-soft); }
  .btn.known{ border-color:var(--green); color:var(--green); }
  .btn.known:hover{ background:var(--green-soft); }
  .btn.wide{ flex:none; width:100%; margin-top:12px; background:var(--ink); color:var(--paper); }

  .fc-stats{
    display:flex; gap:16px; margin-top:16px; font-size:12px; color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    justify-content:center;
  }
  .fc-stats b{ color:var(--ink); }

  /* --- QUIZ MODE --- */
  .q-en{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:32px;
    text-align:center;
    padding:20px 10px 22px;
    border-bottom:1px dashed var(--card-border);
    margin-bottom:16px;
  }
  .q-ex{
    text-align:center;
    font-size:20px;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    font-style:italic;
    line-height:1.5;
    padding:0 6px;
    margin-bottom:10px;
  }
  .q-ex strong{
    font-style:normal;
    border-bottom:2px solid var(--red);
    color:var(--red);
  }
  .q-prompt{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:0;
    margin-bottom:16px;
    font-family:'Noto Serif JP', serif;
  }
  .choices{ display:flex; flex-direction:column; gap:9px; }
  .choice{
    text-align:left;
    padding:12px 14px;
    border:1px solid var(--card-border);
    border-radius:7px;
    background:#FFFDF9;
    font-family:'Noto Serif JP', serif;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink);
  }
  .choice .k{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    color:var(--ink-soft);
    font-size:12px;
    width:16px;
  }
  .choice.correct{ border-color:var(--green); background:var(--green-soft); }
  .choice.wrong{ border-color:var(--red); background:var(--red-soft); }
  .choice[disabled]{ cursor:default; }

  .q-feedback{
    min-height:20px;
    margin-top:12px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    font-family:'Noto Serif JP', serif;
  }
  .q-feedback b{ color:var(--red); }

  .score-strip{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Noto Serif JP', serif; font-size:12px; color:var(--ink-soft);
    margin-bottom:6px;
  }
  .score-strip b{ color:var(--ink); }

  .done{
    text-align:center; padding:30px 10px;
  }
  .done .big{
    font-family:'Noto Serif JP', serif;
    font-size:34px;
    font-weight:700;
    color:var(--red);
    margin-bottom:4px;
  }
  .done .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:18px; }

  /* --- STATUS PAGE --- */
  .st-summary{
    display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
  }
  .st-chip{
    flex:1;
    min-width:90px;
    text-align:center;
    padding:9px 6px;
    border-radius:8px;
    font-family:'Noto Serif JP', serif;
    font-size:12.5px;
    font-weight:700;
    border:1px solid var(--card-border);
  }
  .st-chip.known{ color:var(--green); background:var(--green-soft); border-color:var(--green); }
  .st-chip.again{ color:var(--red); background:var(--red-soft); border-color:var(--red); }
  .st-chip.unseen{ color:var(--ink-soft); background:#F3EFE2; }
  .st-group-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:16px 0 6px;
    padding-bottom:4px;
    border-bottom:1px solid var(--card-border);
  }
  .st-row{
    display:flex;
    align-items:baseline;
    gap:9px;
    padding:7px 2px;
    border-bottom:1px dotted var(--card-border);
    font-size:13px;
  }
  .st-dot{
    width:8px; height:8px; border-radius:50%; flex:0 0 auto;
  }
  .st-dot.known{ background:var(--green); }
  .st-dot.again{ background:var(--red); }
  .st-dot.unseen{ background:#C9C2AC; }
  .st-en{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    color:var(--ink);
    min-width:44%;
  }
  .st-ja{
    color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    font-size:12.5px;
  }

  /* --- MANAGE PAGE --- */
  .mg-section{
    padding:16px 0;
    border-bottom:1px solid var(--card-border);
  }
  .mg-section:first-child{ padding-top:0; }
  .mg-section:last-child{ border-bottom:none; padding-bottom:0; }
  .mg-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .mg-desc{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin-bottom:12px;
  }
  .mg-form{ display:flex; flex-direction:column; gap:10px; }
  .mg-form label{
    display:flex; flex-direction:column; gap:4px;
    font-family:'Noto Serif JP', serif;
    font-size:12px;
    color:var(--ink-soft);
  }
  .mg-form .req{ color:var(--red); font-size:10.5px; }
  .mg-form input, .mg-form select{
    font-family:'Noto Sans JP', sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--card-border);
    border-radius:6px;
    background:#FFFDF9;
    color:var(--ink);
  }
  .mg-row2{ display:flex; gap:10px; }
  .mg-row2 label{ flex:1; }
  .mg-result{ font-size:12.5px; line-height:1.6; margin-top:2px; }
  .mg-success{ color:var(--green); }
  .mg-error{ color:var(--red); }
  .mg-warn{ color:var(--gold); }
  .mg-format-box{
    background:#FFFDF9;
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:14px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.7;
    margin-bottom:12px;
  }
  .mg-format-box code{
    display:inline-block;
    background:var(--paper);
    border:1px solid var(--card-border);
    border-radius:4px;
    padding:3px 8px;
    font-size:12px;
    color:var(--ink);
  }
  .mg-format-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .mg-format-table{
    width:100%;
    border-collapse:collapse;
    margin:10px 0;
    font-size:11.5px;
  }
  .mg-format-table th, .mg-format-table td{
    border:1px solid var(--card-border);
    padding:5px 7px;
    text-align:left;
  }
  .mg-format-table th{
    background:var(--paper);
    font-family:'Noto Serif JP', serif;
  }
  .mg-format-note{ margin-top:10px; }
  .mg-upload{ margin-top:6px; }
  .mg-upload input[type="file"]{
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:'Noto Sans JP', sans-serif;
  }
  .mg-delete-controls{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .mg-delete-controls input{
    flex:1;
    font-family:'Noto Sans JP', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--card-border);
    border-radius:6px;
    background:#FFFDF9;
    color:var(--ink);
  }
  .mg-delete-controls select{
    font-family:'Noto Sans JP', sans-serif;
    font-size:13px;
    padding:8px 8px;
    border:1px solid var(--card-border);
    border-radius:6px;
    background:#FFFDF9;
    color:var(--ink);
  }
  .mg-delete-list{
    max-height:360px;
    overflow-y:auto;
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:4px 10px;
  }
  .mg-del-count{
    font-size:11px; color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    padding:6px 2px 4px;
  }
  .mg-del-empty{
    font-size:12.5px; color:var(--ink-soft);
    padding:14px 4px; text-align:center;
  }
  .mg-del-row{
    display:flex; align-items:center; gap:8px;
    padding:7px 2px;
    border-bottom:1px dotted var(--card-border);
  }
  .mg-del-row:last-child{ border-bottom:none; }
  .mg-del-lv{
    font-family:'Noto Serif JP', serif;
    font-size:10.5px;
    color:var(--ink-soft);
    flex:0 0 auto;
    width:34px;
  }
  .mg-del-en{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    flex:1 1 40%;
  }
  .mg-del-ja{
    font-family:'Noto Serif JP', serif;
    font-size:12px;
    color:var(--ink-soft);
    flex:1 1 30%;
  }
  .mg-del-btn, .mg-del-confirm, .mg-del-cancel{
    font-family:'Noto Sans JP', sans-serif;
    font-size:11.5px;
    font-weight:700;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .mg-del-btn{
    border:1px solid var(--card-border);
    background:#FFFDF9;
    color:var(--ink-soft);
  }
  .mg-del-confirm{
    border:1px solid var(--red);
    background:var(--red-soft);
    color:var(--red);
  }
  .mg-del-cancel{
    border:1px solid var(--card-border);
    background:#FFFDF9;
    color:var(--ink-soft);
  }
  .mg-del-more{
    font-size:11px; color:var(--ink-soft);
    text-align:center; padding:8px 0 4px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>英熟語 記憶カード</h1>
      <div class="sub" id="wordCountSub">共通テスト対策・500熟語収録</div>
    </div>
    <div class="sub" id="dateTag"></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabFc">フラッシュカード</button>
    <button class="tab" id="tabQz">確認テスト</button>
    <button class="tab" id="tabSt">学習状況</button>
    <button class="tab" id="tabMg">熟語を管理</button>
  </div>

  <div class="levelbar" id="levelbar"></div>

  <div class="panel" id="panel"></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--v-verb)"></i>動詞句</span>
    <span><i class="dot" style="background:var(--v-be)"></i>be動詞句</span>
    <span><i class="dot" style="background:var(--v-conj)"></i>接続表現</span>
    <span><i class="dot" style="background:var(--v-adv)"></i>副詞句</span>
  </div>
</div>

<script>
const WORDS = [
  {en:"get along with", ja:"〜とうまくやっていく", ex:"I get along with my classmates.", t:"verb", l:1, exja:"私はクラスメートとうまくやっている。", syn:"hit it off with", synNote:"hit it off withは初対面ですぐ意気投合する意味合いが強い", ant:"fall out with(仲たがいする)"},
  {en:"look forward to", ja:"〜を楽しみにする", ex:"I'm looking forward to the trip.", t:"verb", l:1, exja:"私はその旅行を楽しみにしている。", syn:"anticipate", synNote:"anticipateはより形式的な語で、期待や予測のニュアンスが強い", ant:"dread(恐れる、気が重い)"},
  {en:"take care of", ja:"〜の世話をする", ex:"She takes care of her little brother.", t:"verb", l:1, exja:"彼女は弟の世話をしている。", syn:"look after", synNote:"look afterはより日常的な言い方で意味はほぼ同じ", ant:"neglect(放置する)"},
  {en:"make up for", ja:"〜を埋め合わせる", ex:"He worked hard to make up for lost time.", t:"verb", l:1, exja:"彼は失った時間を埋め合わせるために懸命に働いた。", syn:"compensate for", synNote:"compensate forはより形式的でビジネス・法律的な文脈でも使われる", ant:""},

const TYPE_LABEL = {verb:"動詞句", be:"be動詞句", conj:"接続表現", adv:"副詞句"};
const TYPE_COLOR = {verb:"var(--v-verb)", be:"var(--v-be)", conj:"var(--v-conj)", adv:"var(--v-adv)"};
const LEVEL_LABEL = {1:"基礎", 2:"標準", 3:"応用", 4:"発展", 5:"最難関"};
let currentLevel = 'all';

function wordsForLevel(){
  return currentLevel === 'all' ? WORDS : WORDS.filter(w => w.l === currentLevel);
}

function renderLevelBar(){
  const bar = document.getElementById('levelbar');
  const levels = ['all',1,2,3,4,5];
  bar.innerHTML = levels.map(lv=>{
    const top = lv==='all' ? '全レベル' : `Lv.${lv} ${LEVEL_LABEL[lv]}`;
    const count = lv==='all' ? WORDS.length : WORDS.filter(w=>w.l===lv).length;
    return `<button class="lv-btn ${currentLevel===lv?'active':''}" data-lv="${lv}"><span class="lv-btn-top">${top}</span><span class="lv-btn-bottom">${count}語</span></button>`;
  }).join('');
  [...bar.children].forEach(btn=>{
    btn.onclick = ()=>{
      const v = btn.dataset.lv;
      currentLevel = v==='all' ? 'all' : Number(v);
      resetDecks();
      renderLevelBar();
      if(mode==='fc') renderFc();
      else if(mode==='qz') renderQz();
      else if(mode==='st') renderStatus();
      else renderManage();
    };
  });
}

function resetDecks(){
  fcDeck = shuffle(wordsForLevel()); fcIndex=0; fcKnown=0; fcAgain=0; fcFlipped=false;
  qzDeck = shuffle(wordsForLevel()); qzIndex=0; qzScore=0; qzChoices=[];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightPhrase(ex, phrase){
  if(phrase.includes('...')) return ex; // "not only ... but also" 等はそのまま表示
  const re = new RegExp(escapeRegExp(phrase), 'i');
  if(re.test(ex)) return ex.replace(re, m => `<strong>${m}</strong>`);
  return ex;
}

function phraseKeys(en){
  const s = en.toLowerCase().replace(/\.\.\./g,'').trim();
  const tokens = s.split(/\s+/).filter(Boolean);
  let head = tokens[0];
  if(head === 'be' && tokens.length > 1) head = tokens[1];
  const tail = tokens[tokens.length-1];
  return {head, tail};
}

function buildQuizQuestion(){
  const w = qzDeck[qzIndex];
  const pool = wordsForLevel().filter(x=>x.en!==w.en);
  const wk = phraseKeys(w.en);

  const scored = pool.map(x=>{
    const xk = phraseKeys(x.en);
    let score = 0;
    if(xk.head === wk.head) score += 3;      // 同じ動詞・語幹で紛らわしい (turn down / turn into 等)
    if(xk.tail === wk.tail) score += 2;      // 同じ前置詞で終わる (focus on / count on 等)
    if(x.t === w.t) score += 1;              // 同じ品詞カテゴリ
    score += Math.random() * 0.5;            // 同点内はランダム化
    return {word:x, score};
  }).sort((a,b)=>b.score-a.score);

  const distractors = [];
  const seenJa = new Set([w.ja]);
  for(const {word} of scored){
    if(distractors.length >= 3) break;
    if(seenJa.has(word.ja)) continue;
    seenJa.add(word.ja);
    distractors.push(word);
  }
  qzChoices = shuffle([w, ...distractors]);
  qzAnswered = false;
}

function renderQz(){
  if(qzIndex >= qzDeck.length){
    panel.innerHTML = `
      <div class="done">
        <div class="big">${qzScore} / ${qzDeck.length}</div>

        <button class="btn wide" id="restartQz">もう一度挑戦する</button>
      </div>`;
    document.getElementById('restartQz').onclick = ()=>{
      qzDeck = shuffle(wordsForLevel()); qzIndex=0; qzScore=0; renderQz();
    };
    return;
  }
  buildQuizQuestion();

  const w = qzDeck[qzIndex];
  panel.innerHTML = `
    <div class="score-strip"><span>正解数: <b>${qzScore}</b></span><span>${TYPE_LABEL[w.t]} ・ Lv.${w.l} ${LEVEL_LABEL[w.l]}</span></div>
    <div class="q-en">${w.en}</div>
    <div class="q-ex">${highlightPhrase(w.ex, w.en)}</div>
    <div class="q-prompt">下線部の意味として正しいものを選んでください</div>
    <div class="choices" id="choices"></div>
    <div class="q-feedback" id="feedback"></div>
  `;
  const box = document.getElementById('choices');
  const letters = ['A','B','C','D'];
  qzChoices.forEach((c, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="k">${letters[i]}</span><span>${c.ja}</span>`;
    btn.onclick = ()=>selectAnswer(c, w, box);
    box.appendChild(btn);
  });
  updateFooter(qzIndex+1, qzDeck.length);
}

function selectAnswer(chosen, correct, box){
  if(qzAnswered) return;
  qzAnswered = true;
  const isCorrect = chosen.en === correct.en;
  if(isCorrect) qzScore++;
  [...box.children].forEach(btn=>{
    btn.disabled = true;
    const label = btn.querySelector('span:last-child').textContent;
    if(label === correct.ja) btn.classList.add('correct');
    if(label === chosen.ja && !isCorrect) btn.classList.add('wrong');
  });
  document.getElementById('feedback').innerHTML = isCorrect
    ? `正解です。<b style="color:var(--green)">${correct.en}</b> — ${correct.ex}`

  const next = document.createElement('button');

  next.textContent = qzIndex+1 >= qzDeck.length ? '結果を見る' : '次の問題へ';
  next.onclick = ()=>{ qzIndex++; renderQz(); };
  panel.appendChild(next);
}

/* ============ 熟語管理（CSVエクスポート／手動追加／CSV・xlsxインポート） ============ */

const CSV_HEADERS = ["en","ja","ex","exja","t","l","syn","synNote","ant"];
const CSV_HEADER_LABELS = {
  en:"熟語(en)", ja:"意味(ja)", ex:"例文(ex)", exja:"例文訳(exja)",
  t:"カテゴリ(t)", l:"レベル(l)", syn:"類義語(syn)", synNote:"類義語の解説(synNote)", ant:"反対語(ant)"
};

function csvEscape(v){
  const s = (v===undefined || v===null) ? '' : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function wordsToCSV(list){
  const rows = [CSV_HEADERS.map(h=>csvEscape(CSV_HEADER_LABELS[h])).join(',')];
  list.forEach(w=>{
    rows.push(CSV_HEADERS.map(h=>csvEscape(w[h])).join(','));
  });
  return '\uFEFF' + rows.join('\r\n'); // BOM付きでExcelでも文字化けしないように
}

function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportAllCSV(){
  downloadTextFile('eijukugo_all.csv', wordsToCSV(WORDS));
}

function downloadTemplateCSV(){
  const sample = [{
    en:"make up for", ja:"〜を埋め合わせる", ex:"He worked hard to make up for lost time.",
    exja:"彼は失った時間を埋め合わせるために懸命に働いた。", t:"verb", l:1,
    syn:"compensate for", synNote:"compensate forはより形式的な語", ant:""
  }];
  downloadTextFile('eijukugo_template.csv', wordsToCSV(sample));
}

// ---- CSVテキストのパース（ダブルクオート対応の簡易パーサ） ----
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f=>f.trim()!==''));
}

// ヘッダー行の文字列からCSV_HEADERSのキーを推測してマッピングを作る
function mapHeaderRow(headerRow){
  const keyOf = (h) => {
    h = h.trim().toLowerCase();
    for(const key of CSV_HEADERS){
      if(h === key) return key;
      if(h.startsWith(key + '(') || h.includes('('+key+')')) return key;
    }
    const jpMap = {"熟語":"en","意味":"ja","例文":"ex","例文訳":"exja","カテゴリ":"t","レベル":"l","類義語":"syn","類義語の解説":"synNote","反対語":"ant"};
    for(const jp in jpMap){ if(h.includes(jp)) return jpMap[jp]; }
    return null;
  };
  return headerRow.map(keyOf);
}

function rowsToWordObjects(rows){
  if(rows.length === 0) return {words:[], errors:["データが空です。"]};
  const keys = mapHeaderRow(rows[0]);
  const hasHeader = keys.includes('en') && keys.includes('ja');
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const effectiveKeys = hasHeader ? keys : CSV_HEADERS.slice(0, rows[0].length);

  const words = [];
  const errors = [];
  dataRows.forEach((r, idx)=>{
    const obj = {};
    effectiveKeys.forEach((k, i)=>{ if(k) obj[k] = (r[i]||'').trim(); });
    if(!obj.en || !obj.ja || !obj.ex){
      errors.push(`${idx+1}行目: 熟語(en)・意味(ja)・例文(ex)は必須です。スキップしました。`);
      return;
    }
    const t = ['verb','be','conj','adv'].includes(obj.t) ? obj.t : 'verb';
    let l = parseInt(obj.l, 10);
    if(!(l>=1 && l<=5)) l = 3;
    words.push({
      en: obj.en, ja: obj.ja, ex: obj.ex, exja: obj.exja || '',
      t, l, syn: obj.syn || '', synNote: obj.synNote || '', ant: obj.ant || ''
    });
  });
  return {words, errors};
}

function addWordsBulk(newWords){
  const existing = new Set(WORDS.map(w=>w.en.toLowerCase()));
  let added = 0, dup = 0;
  newWords.forEach(w=>{
    if(existing.has(w.en.toLowerCase())){ dup++; return; }
    WORDS.push(w);
    existing.add(w.en.toLowerCase());
    added++;
  });
  if(added > 0){
    resetDecks();
    renderLevelBar();
    const sub = document.getElementById('wordCountSub');
    if(sub) sub.textContent = `共通テスト対策・${WORDS.length}熟語収録`;
  }
  return {added, dup};
}

      }
    };
    if(isExcel) reader.readAsArrayBuffer(file);
    else reader.readAsText(file, 'UTF-8');
  };

let pendingDelete = new Set(); // 削除確認待ちのインデックス(WORDS配列内)を一時保持

function renderDeleteList(){
  const listEl = document.getElementById('mgDeleteList');
  if(!listEl) return;
  const q = (document.getElementById('mgDelSearch').value || '').trim().toLowerCase();
  const lvFilter = document.getElementById('mgDelLevel').value;

  const rows = WORDS
    .map((w, i) => ({w, i}))
    .filter(({w}) => (lvFilter === 'all' || w.l === Number(lvFilter)))
    .filter(({w}) => !q || w.en.toLowerCase().includes(q) || w.ja.includes(q));

  if(rows.length === 0){
    listEl.innerHTML = `<div class="mg-del-empty">該当する熟語がありません。</div>`;
    return;
  }

  listEl.innerHTML = `<div class="mg-del-count">${rows.length}件表示中</div>` + rows.slice(0, 200).map(({w, i}) => {
    const pending = pendingDelete.has(i);
    return `
      <div class="mg-del-row">
        <span class="mg-del-lv">Lv.${w.l}</span>
        <span class="mg-del-en">${w.en}</span>
        <span class="mg-del-ja">${w.ja}</span>
        ${pending
          ? `<button class="mg-del-confirm" data-idx="${i}">削除する</button><button class="mg-del-cancel" data-idx="${i}">取消</button>`
          : `<button class="mg-del-btn" data-idx="${i}">削除</button>`}
      </div>`;
  }).join('') + (rows.length > 200 ? `<div class="mg-del-more">他 ${rows.length - 200}件は検索で絞り込んでください</div>` : '');

  listEl.querySelectorAll('.mg-del-btn').forEach(btn=>{
    btn.onclick = ()=>{ pendingDelete.add(Number(btn.dataset.idx)); renderDeleteList(); };
  });
  listEl.querySelectorAll('.mg-del-cancel').forEach(btn=>{
    btn.onclick = ()=>{ pendingDelete.delete(Number(btn.dataset.idx)); renderDeleteList(); };
  });
  listEl.querySelectorAll('.mg-del-confirm').forEach(btn=>{
    btn.onclick = ()=>{ deleteWordAt(Number(btn.dataset.idx)); };
  });
}

function deleteWordAt(idx){
  const w = WORDS[idx];
  if(!w) return;
  WORDS.splice(idx, 1);
  pendingDelete.clear(); // インデックスがずれるため確認待ち状態は一旦リセット
  resetDecks();
  renderLevelBar();
  const sub = document.getElementById('wordCountSub');
  if(sub) sub.textContent = `共通テスト対策・${WORDS.length}熟語収録`;
  renderDeleteList();
}
