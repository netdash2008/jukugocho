<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英熟語 単語帳 — 共通テスト対策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Serif+4:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F3E9;
    --paper-line: rgba(35,42,59,0.07);
    --card: #FFFDF7;
    --card-border: #E1D8C1;
    --ink: #232A3B;
    --ink-soft: #6B6455;
    --red: #B23B2E;
    --red-soft: #E8C9C2;
    --green: #2F7A4F;
    --green-soft: #CFE3D4;
    --gold: #A9822F;
    --v-verb: #2F5D8A;
    --v-be: #7A4FA0;
    --v-conj: #B23B2E;
    --v-adv: #2F7A4F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* header */
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:18px;
  }
  .masthead h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:.02em;
  }
  .masthead .sub{
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
  }

  /* tabs styled like page bookmark tabs */
  .tabs{display:flex; gap:6px; margin-bottom:18px;}
  .tab{
    flex:1;
    text-align:center;
    padding:10px 8px 9px;
    font-family:'Noto Serif JP', serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--card-border);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .tab.active{
    color:var(--ink);
    background:var(--card);
    border-color:var(--ink);
    font-weight:700;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--ink);
    border-radius:0 8px 8px 8px;
    padding:26px 22px 22px;
    position:relative;
  }
  .levelbar{
    display:flex;
    gap:7px;
    margin-bottom:14px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .lv-btn{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--card);
    font-family:'Noto Serif JP', serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .lv-btn .n{ font-family:'Source Serif 4', serif; font-weight:700; margin-right:3px; }
  .lv-btn.active{
    border-color:var(--red);
    color:var(--red);
    background:var(--red-soft);
    font-weight:700;
  }
  /* ring holes evoking a binder card */
  .panel::before{
    content:"";
    position:absolute;
    left:-9px; top:26px; bottom:26px; width:16px;
    background-image: radial-gradient(circle, var(--paper) 4px, transparent 4.5px);
    background-size: 16px 34px;
    background-repeat: repeat-y;
    border-radius:8px;
    display:none;
  }
  @media(min-width:560px){ .panel::before{display:block;} }

  /* progress footer, page-number style */
  .pagefoot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    font-family:'Noto Serif JP', serif;
    font-size:12px;
    color:var(--ink-soft);
  }
  .pagefoot .count{ letter-spacing:.05em; }

  /* category dot legend */
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin:14px 2px 0; font-size:11px; color:var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* --- FLASHCARD MODE --- */
  .fc-scene{ perspective:1400px; margin:6px 0 20px; }
  .fc-card{
    height:300px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .fc-card.flipped{ transform:rotateY(180deg); }
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border:1px solid var(--card-border);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 24px,
      #FFFDF9;
  }
  .fc-face.back{ transform:rotateY(180deg); }
  .cat-tag{
    position:absolute; top:12px; left:14px;
    font-size:10.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:5px;
    font-family:'Noto Serif JP', serif;
  }
  .fc-en{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:26px;
    color:var(--ink);
    line-height:1.3;
  }
  .fc-ex-front{
    margin-top:14px;
    font-size:13px;
    font-style:italic;
    color:var(--ink-soft);
    font-family:'Source Serif 4', serif;
    line-height:1.6;
    max-width:88%;
  }
  .fc-hint{
    margin-top:14px; font-size:11.5px; color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
  }
  .fc-ja{
    font-family:'Noto Serif JP', serif;
    font-size:22px;
    font-weight:700;
    color:var(--red);
  }
  .fc-ex{
    margin-top:14px;
    font-size:13px;
    font-style:italic;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    line-height:1.6;
    max-width:90%;
  }
  .fc-exja{
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    line-height:1.6;
    max-width:90%;
  }

  .fc-controls{
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    padding:12px 10px;
    border-radius:7px;
    border:1px solid var(--ink);
    background:var(--card);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.again{ border-color:var(--red); color:var(--red); }
  .btn.again:hover{ background:var(--red-soft); }
  .btn.known{ border-color:var(--green); color:var(--green); }
  .btn.known:hover{ background:var(--green-soft); }
  .btn.wide{ flex:none; width:100%; margin-top:12px; background:var(--ink); color:var(--paper); }

  .fc-stats{
    display:flex; gap:16px; margin-top:16px; font-size:12px; color:var(--ink-soft);
    font-family:'Noto Serif JP', serif;
    justify-content:center;
  }
  .fc-stats b{ color:var(--ink); }

  /* --- QUIZ MODE --- */
  .q-en{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:26px;
    text-align:center;
    padding:20px 10px 22px;
    border-bottom:1px dashed var(--card-border);
    margin-bottom:16px;
  }
  .q-ex{
    text-align:center;
    font-size:14.5px;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    font-style:italic;
    line-height:1.6;
    padding:0 6px;
    margin-bottom:10px;
  }
  .q-ex strong{
    font-style:normal;
    border-bottom:2px solid var(--red);
    color:var(--red);
  }
  .q-prompt{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:0;
    margin-bottom:16px;
    font-family:'Noto Serif JP', serif;
  }
  .choices{ display:flex; flex-direction:column; gap:9px; }
  .choice{
    text-align:left;
    padding:12px 14px;
    border:1px solid var(--card-border);
    border-radius:7px;
    background:#FFFDF9;
    font-family:'Noto Serif JP', serif;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink);
  }
  .choice .k{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    color:var(--ink-soft);
    font-size:12px;
    width:16px;
  }
  .choice.correct{ border-color:var(--green); background:var(--green-soft); }
  .choice.wrong{ border-color:var(--red); background:var(--red-soft); }
  .choice[disabled]{ cursor:default; }

  .q-feedback{
    min-height:20px;
    margin-top:12px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    font-family:'Noto Serif JP', serif;
  }
  .q-feedback b{ color:var(--red); }

  .score-strip{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Noto Serif JP', serif; font-size:12px; color:var(--ink-soft);
    margin-bottom:6px;
  }
  .score-strip b{ color:var(--ink); }

  .done{
    text-align:center; padding:30px 10px;
  }
  .done .big{
    font-family:'Noto Serif JP', serif;
    font-size:34px;
    font-weight:700;
    color:var(--red);
    margin-bottom:4px;
  }
  .done .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:18px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>英熟語 単語帳</h1>
      <div class="sub">共通テスト対策・頻出65熟語</div>
    </div>
    <div class="sub" id="dateTag"></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabFc">フラッシュカード</button>
    <button class="tab" id="tabQz">確認テスト</button>
  </div>

  <div class="levelbar" id="levelbar"></div>

  <div class="panel" id="panel"></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--v-verb)"></i>動詞句</span>
    <span><i class="dot" style="background:var(--v-be)"></i>be動詞句</span>
    <span><i class="dot" style="background:var(--v-conj)"></i>接続表現</span>
    <span><i class="dot" style="background:var(--v-adv)"></i>副詞句</span>
  </div>
</div>

<script>
const WORDS = [
  {en:"get along with", ja:"〜とうまくやっていく", ex:"I get along with my classmates.", t:"verb", l:1, exja:"私はクラスメートとうまくやっている。"},
  {en:"look forward to", ja:"〜を楽しみにする", ex:"I'm looking forward to the trip.", t:"verb", l:1, exja:"私はその旅行を楽しみにしている。"},
  {en:"take care of", ja:"〜の世話をする", ex:"She takes care of her little brother.", t:"verb", l:1, exja:"彼女は弟の世話をしている。"},
  {en:"make up for", ja:"〜を埋め合わせる", ex:"He worked hard to make up for lost time.", t:"verb", l:1, exja:"彼は失った時間を埋め合わせるために懸命に働いた。"},
  {en:"put off", ja:"〜を延期する", ex:"Let's put off the meeting until Friday.", t:"verb", l:1, exja:"会議を金曜日まで延期しよう。"},

  {en:"take part in", ja:"〜に参加する", ex:"Many students took part in the event.", t:"verb", l:1, exja:"多くの生徒がそのイベントに参加した。"},
  {en:"come up with", ja:"〜を思いつく", ex:"She came up with a great idea.", t:"verb", l:1, exja:"彼女は素晴らしい考えを思いついた。"},
  {en:"depend on", ja:"〜次第である／〜に頼る", ex:"It depends on the weather.", t:"verb", l:1, exja:"それは天気次第だ。"},
  {en:"focus on", ja:"〜に集中する", ex:"Please focus on your studies.", t:"verb", l:1, exja:"勉強に集中してください。"},

  {en:"consist of", ja:"〜から成る", ex:"The team consists of ten members.", t:"verb", l:1, exja:"そのチームは10人のメンバーから成る。"},

  {en:"keep up with", ja:"〜に遅れずについていく", ex:"It's hard to keep up with the news.", t:"verb", l:1, exja:"ニュースに遅れずについていくのは難しい。"},
  {en:"catch up with", ja:"〜に追いつく", ex:"He ran to catch up with his friends.", t:"verb", l:1, exja:"彼は友達に追いつくために走った。"},

  {en:"be based on", ja:"〜に基づいている", ex:"The movie is based on a true story.", t:"be", l:1, exja:"その映画は実話に基づいている。"},
  {en:"be different from", ja:"〜と異なる", ex:"This is different from what I expected.", t:"be", l:1, exja:"これは私が期待していたものと異なる。"},
  {en:"be famous for", ja:"〜で有名である", ex:"Kyoto is famous for its temples.", t:"be", l:1, exja:"京都はお寺で有名だ。"},
  {en:"be filled with", ja:"〜でいっぱいである", ex:"Her eyes were filled with tears.", t:"be", l:1, exja:"彼女の目は涙でいっぱいだった。"},

  {en:"be satisfied with", ja:"〜に満足している", ex:"We are satisfied with the result.", t:"be", l:1, exja:"私たちはその結果に満足している。"},
  {en:"be similar to", ja:"〜に似ている", ex:"This song is similar to that one.", t:"be", l:1, exja:"この曲はあの曲に似ている。"},

  {en:"as soon as", ja:"〜するとすぐに", ex:"Call me as soon as you arrive.", t:"conj", l:1, exja:"到着したらすぐに私に電話してください。"},

  {en:"even though", ja:"〜にもかかわらず", ex:"Even though he was tired, he kept working.", t:"conj", l:1, exja:"彼は疲れていたにもかかわらず、働き続けた。"},
  {en:"now that", ja:"今や〜なので", ex:"Now that you're here, let's start.", t:"conj", l:1, exja:"あなたがここに来た今、始めましょう。"},
  {en:"not only ... but also", ja:"〜だけでなく…も", ex:"She is not only smart but also kind.", t:"conj", l:1, exja:"彼女は賢いだけでなく親切でもある。"},
  {en:"as if", ja:"まるで〜のように", ex:"He talks as if he knew everything.", t:"conj", l:1, exja:"彼はまるで何でも知っているかのように話す。"},
  {en:"provided that", ja:"〜という条件で", ex:"You may go provided that you finish your work.", t:"conj", l:1, exja:"仕事を終えるという条件で、あなたは行ってもよい。"},

  {en:"as a result", ja:"その結果", ex:"As a result, sales increased.", t:"adv", l:1, exja:"その結果、売上が増加した。"},

  {en:"in addition to", ja:"〜に加えて", ex:"In addition to English, he speaks French.", t:"adv", l:1, exja:"英語に加えて、彼はフランス語も話す。"},
  {en:"in the end", ja:"結局", ex:"In the end, they agreed.", t:"adv", l:1, exja:"結局、彼らは同意した。"},
  {en:"all of a sudden", ja:"突然", ex:"All of a sudden, the lights went out.", t:"adv", l:1, exja:"突然、明かりが消えた。"},
  {en:"in general", ja:"一般に", ex:"In general, prices are lower here.", t:"adv", l:1, exja:"一般に、ここでは物価が安い。"},
  {en:"in fact", ja:"実際に", ex:"In fact, I've never been there.", t:"adv", l:1, exja:"実際、私はそこに行ったことがない。"},
  {en:"in other words", ja:"言い換えると", ex:"In other words, we need more time.", t:"adv", l:1, exja:"言い換えると、私たちにはもっと時間が必要だ。"},

const TYPE_LABEL = {verb:"動詞句", be:"be動詞句", conj:"接続表現", adv:"副詞句"};
const TYPE_COLOR = {verb:"var(--v-verb)", be:"var(--v-be)", conj:"var(--v-conj)", adv:"var(--v-adv)"};
const LEVEL_LABEL = {1:"基礎", 2:"標準", 3:"応用", 4:"発展", 5:"最難関"};
let currentLevel = 'all';

function wordsForLevel(){
  return currentLevel === 'all' ? WORDS : WORDS.filter(w => w.l === currentLevel);
}

function renderLevelBar(){
  const bar = document.getElementById('levelbar');
  const levels = ['all',1,2,3,4,5];
  bar.innerHTML = levels.map(lv=>{
    const label = lv==='all' ? '全レベル' : LEVEL_LABEL[lv];
    const count = lv==='all' ? WORDS.length : WORDS.filter(w=>w.l===lv).length;
    const numTag = lv==='all' ? '' : `<span class="n">Lv.${lv}</span>`;
    return `<button class="lv-btn ${currentLevel===lv?'active':''}" data-lv="${lv}">${numTag}${label}（${count}）</button>`;
  }).join('');
  [...bar.children].forEach(btn=>{
    btn.onclick = ()=>{
      const v = btn.dataset.lv;
      currentLevel = v==='all' ? 'all' : Number(v);
      resetDecks();
      renderLevelBar();
      if(mode==='fc') renderFc(); else renderQz();
    };
  });
}

function resetDecks(){
  fcDeck = shuffle(wordsForLevel()); fcIndex=0; fcKnown=0; fcAgain=0; fcFlipped=false;
  qzDeck = shuffle(wordsForLevel()); qzIndex=0; qzScore=0; qzChoices=[];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

document.getElementById('dateTag').textContent = new Date().toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric'});

/* ---------- FLASHCARD STATE ---------- */
let fcDeck = shuffle(wordsForLevel());
let fcIndex = 0;
let fcFlipped = false;
let fcKnown = 0;
let fcAgain = 0;

/* ---------- QUIZ STATE ---------- */
let qzDeck = shuffle(wordsForLevel());
let qzIndex = 0;
let qzScore = 0;
let qzAnswered = false;
let qzChoices = [];

const panel = document.getElementById('panel');
const tabFc = document.getElementById('tabFc');
const tabQz = document.getElementById('tabQz');
let mode = 'fc';

tabFc.onclick = ()=>{ mode='fc'; tabFc.classList.add('active'); tabQz.classList.remove('active'); renderFc(); };
tabQz.onclick = ()=>{ mode='qz'; tabQz.classList.add('active'); tabFc.classList.remove('active'); renderQz(); };

function renderFc(){
  if(fcIndex >= fcDeck.length){
    panel.innerHTML = `
      <div class="done">
        <div class="big">${fcKnown} / ${fcDeck.length}</div>
        <div class="sub">覚えた熟語の数です。もう一周してみましょう。</div>
        <button class="btn wide" id="restartFc">最初からやり直す</button>
      </div>`;
    document.getElementById('restartFc').onclick = ()=>{
      fcDeck = shuffle(wordsForLevel()); fcIndex=0; fcKnown=0; fcAgain=0; fcFlipped=false; renderFc();
    };
    return;
  }
  const w = fcDeck[fcIndex];
  panel.innerHTML = `
    <div class="fc-scene">
      <div class="fc-card ${fcFlipped ? 'flipped':''}" id="fcCard">
        <div class="fc-face front">
          <span class="cat-tag"><i class="dot" style="background:${TYPE_COLOR[w.t]}"></i>${TYPE_LABEL[w.t]} ・ Lv.${w.l} ${LEVEL_LABEL[w.l]}</span>
          <div class="fc-en">${w.en}</div>
          <div class="fc-ex-front">${w.ex}</div>
          <div class="fc-hint">タップして意味を確認</div>
        </div>
        <div class="fc-face back">
          <span class="cat-tag"><i class="dot" style="background:${TYPE_COLOR[w.t]}"></i>${TYPE_LABEL[w.t]} ・ Lv.${w.l} ${LEVEL_LABEL[w.l]}</span>
          <div class="fc-ja">${w.ja}</div>
          <div class="fc-ex">${w.ex}</div>
          <div class="fc-exja">${w.exja}</div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="btn again" id="btnAgain">もう一度</button>
      <button class="btn known" id="btnKnown">覚えた</button>
    </div>
    <div class="fc-stats">
      <span>覚えた: <b>${fcKnown}</b></span>
      <span>復習: <b>${fcAgain}</b></span>
    </div>
  `;
  document.getElementById('fcCard').onclick = ()=>{ fcFlipped = !fcFlipped; document.getElementById('fcCard').classList.toggle('flipped'); };
  document.getElementById('btnAgain').onclick = (e)=>{ e.stopPropagation(); fcAgain++; nextFc(); };
  document.getElementById('btnKnown').onclick = (e)=>{ e.stopPropagation(); fcKnown++; nextFc(); };
  updateFooter(fcIndex+1, fcDeck.length);
}
function nextFc(){ fcIndex++; fcFlipped=false; renderFc(); }

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightPhrase(ex, phrase){
  if(phrase.includes('...')) return ex; // "not only ... but also" 等はそのまま表示
  const re = new RegExp(escapeRegExp(phrase), 'i');
  if(re.test(ex)) return ex.replace(re, m => `<strong>${m}</strong>`);
  return ex;
}

function buildQuizQuestion(){
  const w = qzDeck[qzIndex];
  const pool = wordsForLevel();
  const distractors = shuffle(pool.filter(x=>x.en!==w.en)).slice(0,3);
  qzChoices = shuffle([w, ...distractors]);
  qzAnswered = false;
}

function renderQz(){
  if(qzIndex >= qzDeck.length){
    panel.innerHTML = `
      <div class="done">
        <div class="big">${qzScore} / ${qzDeck.length}</div>
        <div class="sub">正解数です。間違えた熟語はフラッシュカードで復習しましょう。</div>
        <button class="btn wide" id="restartQz">もう一度挑戦する</button>
      </div>`;
    document.getElementById('restartQz').onclick = ()=>{
      qzDeck = shuffle(wordsForLevel()); qzIndex=0; qzScore=0; renderQz();
    };
    return;
  }
  buildQuizQuestion();

  const w = qzDeck[qzIndex];
  panel.innerHTML = `
    <div class="score-strip"><span>正解数: <b>${qzScore}</b></span><span>${TYPE_LABEL[w.t]} ・ Lv.${w.l} ${LEVEL_LABEL[w.l]}</span></div>
    <div class="q-en">${w.en}</div>
    <div class="q-ex">${highlightPhrase(w.ex, w.en)}</div>
    <div class="q-prompt">下線部の意味として正しいものを選んでください</div>
    <div class="choices" id="choices"></div>
    <div class="q-feedback" id="feedback"></div>
  `;
  const box = document.getElementById('choices');
  const letters = ['A','B','C','D'];
  qzChoices.forEach((c, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="k">${letters[i]}</span><span>${c.ja}</span>`;
    btn.onclick = ()=>selectAnswer(c, w, box);
    box.appendChild(btn);
  });
  updateFooter(qzIndex+1, qzDeck.length);
}

function selectAnswer(chosen, correct, box){
  if(qzAnswered) return;
  qzAnswered = true;
  const isCorrect = chosen.en === correct.en;
  if(isCorrect) qzScore++;
  [...box.children].forEach(btn=>{
    btn.disabled = true;
    const label = btn.querySelector('span:last-child').textContent;
    if(label === correct.ja) btn.classList.add('correct');
    if(label === chosen.ja && !isCorrect) btn.classList.add('wrong');
  });
  document.getElementById('feedback').innerHTML = isCorrect
    ? `正解です。<b style="color:var(--green)">${correct.en}</b> — ${correct.ex}`
    : `不正解。正しい意味は「<b>${correct.ja}</b>」。 ${correct.ex}`;
  const next = document.createElement('button');
  next.className = 'btn wide';
  next.textContent = qzIndex+1 >= qzDeck.length ? '結果を見る' : '次の問題へ';
  next.onclick = ()=>{ qzIndex++; renderQz(); };
  panel.appendChild(next);
}

function updateFooter(cur, total){
  let foot = panel.querySelector('.pagefoot');
  if(!foot){
    foot = document.createElement('div');
    foot.className = 'pagefoot';
    panel.appendChild(foot);
  }
  foot.innerHTML = `<span>共通テスト対策 英熟語帳</span><span class="count">${cur} / ${total}</span>`;
}

renderLevelBar();
renderFc();
</script>
</body>
</html>
